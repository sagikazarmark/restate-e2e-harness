[package]
name = "restate-e2e-harness"
version = "0.1.0"
description = "End-to-end test harness for restate_sdk endpoints against a real restate-server: server gate and launcher, in-process deployment, ingress, admin API and journal introspection (unix only)"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/restate-e2e-harness"
keywords = ["restate", "testing", "e2e"]
categories = ["development-tools::testing"]

[dependencies]
# Managed HTTP/2 serving: own connection and stream tasks through forced shutdown.
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
restate-sdk = "0.12.0"
serde = "1.0.228"
serde_json = "1.0.118"
# `rt` for the stop-signal handler's own runtime, `signal` for what it waits
# on, `sync` for the sampler's stop channel, `macros` for `select!`, `net` and
# `time` for the deployment's listener and the polls.
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "signal", "sync", "time"] }

# The harness spawns `restate-server` in a process group of its own and kills
# the group with `killpg(2)`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
# Safe non-reaping waitid on Linux and macOS (nix exposes it only on some Unix targets).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
h2 = "0.4"
http = "1.4.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-message = "Release {{version}}"
tag-prefix = ""
