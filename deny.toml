[graph]
all-features = true

[advisories]
# Transitive rsa via the SDK's JWT dependency; request identity uses EdDSA public
# key verification, not RSA private-key operations. No patched release exists.
# Revisit on an upstream fix or crypto usage change; see .cargo/audit.toml.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
